# Sample workflow for building and deploying a sfab site to GitHub Pages.
# Push is disabled on this fork: the rewardStyle org blocks GitHub Pages
# creation, and this repo has no Pages site. actions/configure-pages then
# fails every main push with "Get Pages site failed" (HTTP 404).
name: Deploy sfab with GitHub Pages dependencies preinstalled

on:
  # Manual only. A run still fails until an org admin allows Pages and the
  # site is set to build with GitHub Actions.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Use Node.js and Build with sfab
        uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
